[package]
name        = "sunbeam-proxy"
version = "0.2.3"
edition     = "2024"
description = "A cloud-native reverse proxy with ML-powered security"
license     = "AGPL-3.0-or-later"
repository    = "https://github.com/sunbeamdotpt/proxy"
publish = false

[lib]
name = "sunbeam_proxy"
path = "src/lib.rs"

[dependencies]
# Pingora with rustls backend
pingora       = { version = "0.8", features = ["rustls"] }
pingora-proxy = { version = "0.8", features = ["rustls"] }
pingora-core  = { version = "0.8", features = ["rustls"] }
pingora-http   = "0.8"
pingora-cache  = { version = "0.8", features = ["rustls"] }

# HTTP header constants
http = "1.4"

# Config
serde      = "1"
# proxy needs 0.8 (pingora config API surface).
toml       = "0.8"

# Async
tokio      = "1"
futures    = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Structured logging + OTEL
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry         = "0.32"
opentelemetry_sdk     = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp    = "0.32"
serde_json = "1"
anyhow     = "1"

# CLI + serialization
clap        = { version = "4", features = ["env"] }
rkyv        = "0.8"
rustc-hash  = "2"
caddyfile-rs = "0.1"

# Lock-free Arc swapping
arc-swap    = "1"

# Reverse DNS for bot IP verification
dns-lookup  = "3"

# Prometheus metrics
prometheus  = "0.14"

# Request IDs
uuid = "1"

# Static file serving and body rewriting
bytes = "1"
regex = "1"

# Allocator
mimalloc = "*"

# Auth subrequests
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# Rustls crypto provider — must be installed before any TLS init.
# Uses aws-lc-rs (required by pingora-rustls).
rustls      = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"
x509-parser = "0.18"

# K8s watcher for cert/config hot-reload
kube        = { version = "3", default-features = false, features = ["derive", "runtime", "rustls-tls"] }
kube-derive = "3.1"
k8s-openapi = { version = "0.27", features = ["schemars", "v1_32"] }
chrono      = "0.4"
libc        = "0.2"
schemars    = "1"
serde_yaml  = "0.9"
tower       = { version = "0.5", default-features = false }

# Cluster gossip (iroh QUIC + HyParView/PlumTree)
iroh        = "1.0"
iroh-gossip = "0.101"
blake3      = "1"
hex         = "0.4"
# rand 0.10 is used by iroh 1.0 APIs.
rand        = "0.10"
tempfile    = "3"

# Dataset ingestion (CIC-IDS2017 CSV parsing)
csv         = "1"

# burn-rs ML framework (training only, behind `training` feature)
burn = { version = "0.20", optional = true, features = ["wgpu", "autodiff", "train", "std"] }
gateway-api = { version = "0.21", features = ["experimental"] }
tokio-rustls = "0.26"

[features]
training = ["burn"]

[dev-dependencies]
criterion     = { version = "0.8", features = ["html_reports"] }
proptest      = "1"
tempfile      = "3"
reqwest       = { version = "0.13", default-features = false, features = ["json", "rustls"] }
http-body-util = "0.1"
rcgen         = "0.14"
time          = "0.3"
testcontainers = "0.27.3"
sunbeam-test = { git = "https://github.com/sunbeamdotpt/test.git", branch = "mainline" }

[[test]]
name = "gateway_reconcile"
path = "tests/gateway_reconcile/main.rs"

[[bench]]
name = "scanner_bench"
harness = false

[[bench]]
name = "ddos_bench"
harness = false

[[bench]]
name = "crown_bench"
harness = false

[[bench]]
name = "ddos_crown_bench"
harness = false

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
