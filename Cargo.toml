[package]
name        = "sunbeam-proxy"
version     = "0.1.1"
edition     = "2021"
description = "Pingora-based reverse proxy with ML-powered security"
license     = "MIT"
repository    = "https://src.sunbeam.pt/studio/sunbeam"

[lib]
name = "sunbeam_proxy"
path = "src/lib.rs"

[dependencies]
# Pingora with rustls backend (pure Rust TLS, no BoringSSL C build)
# Version pins are NOT workspace = true because pingora is path-patched via
# [patch.crates-io] in the root Cargo.toml (3p/pingora submodule @ 0.8.0).
pingora       = { version = "0.8", features = ["rustls"] }
pingora-proxy = { version = "0.8", features = ["rustls"] }
pingora-core  = { version = "0.8", features = ["rustls"] }
pingora-http   = "0.8"
pingora-cache  = { version = "0.8", features = ["rustls"] }

# HTTP header constants
http = { workspace = true }

# Config
serde      = { workspace = true }
# toml: workspace pins 0.9; proxy needs 0.8 (pingora config API surface).
# Keep inline until workspace bumps to 0.9 and proxy is validated against it.
toml       = "0.8"

# Async
tokio      = { workspace = true }
futures    = { workspace = true }
async-trait = { workspace = true }
pin-project-lite = { workspace = true }

# Structured logging + OTEL
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry         = { workspace = true }
opentelemetry_sdk     = { workspace = true }
opentelemetry-otlp    = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }

# CLI + serialization
clap        = { workspace = true }
bincode     = { workspace = true }
rustc-hash  = { workspace = true }

# Lock-free Arc swapping for hot-reload (scanner model)
arc-swap    = { workspace = true }

# Reverse DNS for bot IP verification
dns-lookup  = { workspace = true }

# Prometheus metrics
prometheus  = { workspace = true }

# Request IDs
uuid = { workspace = true }

# Static file serving and body rewriting
bytes = { workspace = true }
regex = { workspace = true }

# Auth subrequests
reqwest = { workspace = true }

# Rustls crypto provider — must be installed before any TLS init.
# Uses aws-lc-rs (required by pingora-rustls); workspace pins "ring" variant
# for non-proxy crates. Keep inline to avoid feature unification forcing
# aws-lc-rs onto all workspace members.
rustls      = { version = "0.23", features = ["aws-lc-rs"] }

# K8s watcher for cert/config hot-reload
kube        = { workspace = true }
k8s-openapi = { workspace = true }
libc        = { workspace = true }

# Cluster gossip (iroh QUIC + HyParView/PlumTree)
# Aligned from 0.96 → 0.95 to match workspace pin.
iroh        = { workspace = true }
iroh-gossip = { workspace = true }
blake3      = "1"
hex         = { workspace = true }
# rand 0.9 (proxy) vs 0.8 (workspace/estafeta-server) — different majors;
# cargo can multi-version these but workspace = true would force 0.8. Keep inline.
rand        = "0.9"
tempfile    = { workspace = true }

# Dataset ingestion (CIC-IDS2017 CSV parsing)
csv         = { workspace = true }

# burn-rs ML framework (training only, behind `training` feature)
burn = { workspace = true, optional = true, features = ["wgpu", "autodiff", "train", "std"] }

[features]
training = ["burn"]

[dev-dependencies]
criterion     = { version = "0.5", features = ["html_reports"] }
proptest      = { workspace = true }
tempfile      = { workspace = true }
tokio-rustls  = { workspace = true }

[[bench]]
name = "scanner_bench"
harness = false

[[bench]]
name = "ddos_bench"
harness = false

[[bench]]
name = "crown_bench"
harness = false

[[bench]]
name = "ddos_crown_bench"
harness = false

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
