#
# Example HTTPRoute attached to the sunbeam-example Gateway.
# Requests for `example.local` with path prefix `/api` are forwarded to
# the `api` service in the `default` namespace.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sunbeam-example-api
  namespace: default
spec:
  parentRefs:
    - name: sunbeam-example
      namespace: default
      sectionName: http
  hostnames:
    - "example.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
