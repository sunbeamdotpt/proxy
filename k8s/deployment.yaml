#
# sunbeam-proxy Deployment + Service.
# Expects the Gateway API CRDs to be installed separately
# (infra/gateway-api/standard-install.yaml).

apiVersion: v1
kind: ConfigMap
metadata:
  name: sunbeam-proxy-config
  namespace: sunbeam-proxy
data:
  config.toml: |
    [listen]
    http  = "0.0.0.0:8080"
    https = "0.0.0.0:8443"

    [tls]
    cert_path = "/etc/sunbeam/tls/tls.crt"
    key_path  = "/etc/sunbeam/tls/tls.key"

    [telemetry]
    otlp_endpoint = ""
    metrics_port  = 9090

    [kubernetes]
    namespace        = "sunbeam-proxy"
    tls_secret       = "sunbeam-proxy-tls"
    config_configmap = "sunbeam-proxy-config"

    [gateway]
    enabled = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunbeam-proxy
  namespace: sunbeam-proxy
  labels:
    app: sunbeam-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sunbeam-proxy
  template:
    metadata:
      labels:
        app: sunbeam-proxy
    spec:
      serviceAccountName: sunbeam-proxy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          # Pin to a released tag and replace with the version you are deploying.
          image: src.sunbeam.pt/studio/proxy:v0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: gossip
              containerPort: 8746
          env:
            - name: RUST_LOG
              value: "info,sunbeam_proxy=debug"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: config
              mountPath: /etc/pingora
              readOnly: true
            - name: tls
              mountPath: /etc/sunbeam/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sunbeam-proxy-config
        - name: tls
          secret:
            secretName: sunbeam-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: sunbeam-proxy
  namespace: sunbeam-proxy
  labels:
    app: sunbeam-proxy
spec:
  selector:
    app: sunbeam-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
  type: LoadBalancer
