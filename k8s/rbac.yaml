#
# RBAC for the sunbeam-proxy Gateway API controller.
# The proxy needs cluster-scoped read access to Gateway API CRDs and
# namespace-scoped write access to patch Gateway / HTTPRoute status.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sunbeam-proxy
  namespace: sunbeam-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sunbeam-proxy-gateway
rules:
  # Gateway API resources (cluster-scoped read).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes", "tcproutes", "udproutes", "tlsroutes", "referencegrants", "gatewayclasses", "listenersets", "backendtlspolicies"]
    verbs: ["get", "list", "watch"]
  # Status writeback (leader only).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status", "httproutes/status", "grpcroutes/status", "tcproutes/status", "udproutes/status", "tlsroutes/status", "gatewayclasses/status", "listenersets/status", "backendtlspolicies/status"]
    verbs: ["patch", "update"]
  # Lease API for leader election. Scoped to the single lease object we create.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["sunbeam-proxy-gateway"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Core resources for backend resolution, namespace selectors, pod/Svc endpoints,
  # and frontend client-certificate CA ConfigMaps.
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints", "pods", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Secrets may be referenced cross-namespace by Gateway certificateRefs when
  # permitted by a ReferenceGrant. Limiting this to named resources is not
  # practical for dynamic Gateway API usage; restrict to read-only verbs.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # EndpointSlices for headless / manually-endpointed Service backends.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
# Namespaced access for the proxy's own hot-reload ConfigMap and TLS Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sunbeam-proxy-config
  namespace: sunbeam-proxy
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sunbeam-proxy-config"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sunbeam-proxy-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sunbeam-proxy-config
  namespace: sunbeam-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sunbeam-proxy-config
subjects:
  - kind: ServiceAccount
    name: sunbeam-proxy
    namespace: sunbeam-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sunbeam-proxy-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sunbeam-proxy-gateway
subjects:
  - kind: ServiceAccount
    name: sunbeam-proxy
    namespace: sunbeam-proxy
