#
# RBAC for the sunbeam-proxy Gateway API controller.
# The proxy needs cluster-scoped read access to Gateway API CRDs and
# namespace-scoped write access to patch Gateway / HTTPRoute status.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sunbeam-proxy
  namespace: sunbeam-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sunbeam-proxy-gateway
rules:
  # Gateway API resources (cluster-scoped read).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "tcproutes", "udproutes", "tlsroutes", "referencegrants", "gatewayclasses"]
    verbs: ["get", "list", "watch"]
  # Status writeback (leader only).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status", "httproutes/status", "tcproutes/status", "udproutes/status", "tlsroutes/status", "gatewayclasses/status"]
    verbs: ["patch", "update"]
  # Lease API for leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Core resources for backend resolution, namespace selectors, cert/config reload.
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints", "pods", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  # EndpointSlices for headless / manually-endpointed Service backends.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sunbeam-proxy-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sunbeam-proxy-gateway
subjects:
  - kind: ServiceAccount
    name: sunbeam-proxy
    namespace: sunbeam-proxy
