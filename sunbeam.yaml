schema: 1
project:
  name: proxy
  kind: rust-bin
  description: "Sunbeam TLS-terminating reverse proxy built on Pingora with DDoS/scanner detection."
targets:
  build:
    exec: "cargo build --release"
  test:
    exec: [cargo, nextest, run]
  lint:
    exec: "cargo clippy -- -D warnings"
  fmt:
    exec: "cargo fmt"
  clean:
    exec: "cargo clean"
  doc:
    exec: "cargo doc --no-deps"
  package:
    exec: |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --push \
        -t ghcr.io/sunbeamdotpt/sunbeam-proxy:latest \
        -t ghcr.io/sunbeamdotpt/sunbeam-proxy:${PROXY_TAG:-latest} \
        -f platform/proxy/Dockerfile \
        .
tenant:
  namespace: sunbeam-proxy
outputs:
  - target/release/sunbeam-proxy
