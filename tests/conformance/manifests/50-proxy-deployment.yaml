apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunbeam-proxy
  namespace: gateway-conformance
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sunbeam-proxy
  template:
    metadata:
      labels:
        app: sunbeam-proxy
    spec:
      serviceAccountName: sunbeam-proxy
      terminationGracePeriodSeconds: 5
      containers:
        - name: proxy
          image: ghcr.io/sunbeamdotpt/proxy:v0.2.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sunbeam-proxy", "serve"]
          env:
            - name: SUNBEAM_CONFIG
              value: /etc/sunbeam/config.toml
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SUNBEAM_GATEWAY_ADDRESS
              value: "192.168.252.19"
          ports:
            - containerPort: 80
              hostPort: 80
              name: http
            - containerPort: 18080
              hostPort: 18080
              name: http-18080
            - containerPort: 8080
              hostPort: 8080
              name: http-8080
            - containerPort: 8082
              hostPort: 8082
              name: http-8082
            - containerPort: 8090
              hostPort: 8090
              name: http-8090
            - containerPort: 443
              hostPort: 443
              name: https
            - containerPort: 8443
              hostPort: 8443
              name: tls-8443
            - containerPort: 8883
              hostPort: 8883
              name: tls-8883
            - containerPort: 5300
              hostPort: 5300
              protocol: UDP
              name: udp-5300
          volumeMounts:
            - name: config
              mountPath: /etc/sunbeam
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: sunbeam-proxy-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sunbeam-proxy-config
  namespace: gateway-conformance
data:
  config.toml: |
    [listen]
    http = "0.0.0.0:80"
    https = "0.0.0.0:443"
    extra_http = ["0.0.0.0:18080", "0.0.0.0:8080", "0.0.0.0:8082"]

    [tls]
    cert_path = "/tmp/sunbeam-test-cert.pem"
    key_path = "/tmp/sunbeam-test-key.pem"

    [telemetry]
    otlp_endpoint = ""
    metrics_port = 0

    [kubernetes]
    namespace = "gateway-conformance"
    tls_secret = "sunbeam-proxy-tls"
    config_configmap = "sunbeam-proxy-config"

    [gateway]
    enabled = true
